 x="30" y="347" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="364" font-size="12.5" fill="#1b2230">One bar per day with at least one addition; the dashed line is the SRP go-live (11 Sep 2026) when it falls in the window. 86 additions on 33 of 61</text><text x="30" y="381" font-size="12.5" fill="#1b2230">days. Most days without a bar are weekends.</text><text x="18" y="422" font-size="11.5" fill="#5d6677">Limits: A day without a bar is a day without additions, not missing data. Daily counts are small and noisy; do not read a trend out of a few days.</text><text x="18" y="442" font-size="10.5" fill="#5d6677">EUVD statistics, 26 Nov 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
