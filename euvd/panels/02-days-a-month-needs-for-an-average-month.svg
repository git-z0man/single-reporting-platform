<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 709" width="936" height="709" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><rect x="0.5" y="0.5" width="935" height="708" fill="none" stroke="#dde1e8"/><text x="18" y="29" font-size="10" letter-spacing="0.6" fill="#5d6677">CUMULATIVE</text><text x="18" y="50" font-size="17" fill="#1b2230" font-weight="600">2. Days a month needs for an average month</text><text x="18" y="69" font-size="11.5" fill="#5d6677">/api/search totals one day at a time (fromDate = toDate), a sliding window of the last 4 months, cached day by day in stats.json.</text><g transform="translate(18,79) scale(1)" font-size="11"><svg viewBox="0 0 900 300" role="img" width="900" height="300"><g><line x1="58" x2="828" y1="270" y2="270" stroke="rgb(233, 236, 241)"></line><text x="52" y="274" text-anchor="end" fill="rgb(93, 102, 119)">0</text><line x1="58" x2="828" y1="238.25" y2="238.25" stroke="rgb(233, 236, 241)"></line><text x="52" y="242.25" text-anchor="end" fill="rgb(93, 102, 119)">2,000</text><line x1="58" x2="828" y1="206.5" y2="206.5" stroke="rgb(233, 236, 241)"></line><text x="52" y="210.5" text-anchor="end" fill="rgb(93, 102, 119)">4,000</text><line x1="58" x2="828" y1="174.75" y2="174.75" stroke="rgb(233, 236, 241)"></line><text x="52" y="178.75" text-anchor="end" fill="rgb(93, 102, 119)">6,000</text><line x1="58" x2="828" y1="143" y2="143" stroke="rgb(233, 236, 241)"></line><text x="52" y="147" text-anchor="end" fill="rgb(93, 102, 119)">8,000</text><line x1="58" x2="828" y1="111.25" y2="111.25" stroke="rgb(233, 236, 241)"></line><text x="52" y="115.25" text-anchor="end" fill="rgb(93, 102, 119)">10,000</text><line x1="58" x2="828" y1="79.5" y2="79.5" stroke="rgb(233, 236, 241)"></line><text x="52" y="83.5" text-anchor="end" fill="rgb(93, 102, 119)">12,000</text><line x1="58" x2="828" y1="47.75" y2="47.75" stroke="rgb(233, 236, 241)"></line><text x="52" y="51.75" text-anchor