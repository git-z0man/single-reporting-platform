66666666666,143.25400000000002 725.3333333333334,136.126125 751,132.0145 776.6666666666666,127.648875 802.3333333333334,117.02850000000001 828,114.091625" fill="none" stroke="rgb(75, 127, 184)" stroke-width="1.5" opacity="0.55"></polyline><text x="833" y="118.091625" fill="rgb(93, 102, 119)">Jul 26<title fill="rgb(93, 102, 119)">July 2026: 9,821 records in 31 days</title></text><circle cx="443" cy="204.26162499999998" r="4" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">July 2026 reached 4,141 on day 16</title></circle><polyline points="58,267.6505 83.66666666666667,266.85675 109.33333333333334,261.951375 135,257.633375 160.66666666666669,250.775375 186.33333333333334,243.09187500000002 212,239.694625 237.66666666666666,238.710375 263.33333333333337,237.472125 289,226.740625 314.6666666666667,211.8975 340.3333333333333,205.00775 366,195.35575 391.6666666666667,192.149 417.3333333333333,177.417 443,175.686625 468.6666666666667,170.320875 494.3333333333333,147.968875 520,137.269125 545.6666666666667,129.839625 571.3333333333334,125.71212499999999 597,121.88624999999999 622.6666666666666,121.20362499999999 648.3333333333334,116.282375 674,103.78875 699.6666666666666,97.518125 725.3333333333334,90.564875 751,82.690875 776.6666666666666,81.62725 802.3333333333334,80.16675000000001 828,74.49937499999999" fill="none" stroke="rgb(75, 127, 184)" stroke-width="1.5" opacity="0.55"></polyline><text x="833" y="78.49937499999999" fill="rgb(93, 102, 119)">Aug 26<title fill="rgb(93, 102, 119)">August 2026: 12,315 records in 31 days</title></text><circle cx="366" cy="204.26162499999998" r="4" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">August 2026 reached 4,141 on day 13</title></circle><polyline points="58,262.427625 83.66666666666667,257.315875 109.33333333333334,251.823125 135,242.8855 160.66666666666669,240.80587500000001 186.33333333333334,239.345375 212,235.344875 237.66666666666666,210.51637499999998 263.33333333333337,200.13412499999998 289,194.03812499999998 314.6666666666667,182.878 340.3333333333333,181.38575 366,179.27437500000002 391.6666666666667,166.90775 417.3333333333333,144.26999999999998 443,130.442875 468.6666666666667,114.01225 494.3333333333333,105.85249999999999 520,104.217375 545.6666666666667,102.5505 571.3333333333334,98.01025000000001 597,90.77125000000001 622.6666666666666,83.27825000000001 648.3333333333334,74.49937499999999 674,63.688500000000005 699.6666666666666,59.62450000000001 725.3333333333334,57.227374999999995 751,52.242625000000004 776.6666666666666,42.543000000000006 802.3333333333334,32.446499999999986" fill="none" stroke="rgb(75, 127, 184)" stroke-width="1.5" opacity="0.55"></polyline><text x="807.3333333333334" y="36.446499999999986" fill="rgb(93, 102, 119)">Sep 26<title fill="rgb(93, 102, 119)">September 2026: 14,964 records in 30 days</title></text><circle cx="263.33333333333337" cy="204.26162499999998" r="4" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">September 2026 reached 4,141 on day 9</title></circle><circle cx="674" cy="73.72149999999999" r="4" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">September 2026 reached 12,364 on day 25</title></circle><polyline points="58,263.7135 83.66666666666667,257.39525 109.33333333333334,255.5855 135,254.5695 160.66666666666669,248.013125 186.33333333333334,231.820625 212,226.581875 237.66666666666666,218.53325 263.33333333333337,213.51675 289,206.992125 314.6666666666667,203.277375 340.3333333333333,192.43475 366,156.065125 391.6666666666667,142.984125 417.3333333333333,133.427375 443,126.15662499999999 468.6666666666667,124.56912500000001 494.3333333333333,115.28225 520,114.980625" fill="none" stroke="rgb(31, 95, 168)" stroke-width="2.5" opacity="1"></polyline><text x="525" y="118.980625" class="t" fill="rgb(27, 34, 48)">Oct 26<title fill="rgb(27, 34, 48)">October 2026: 9,765 records in 19 days</title></text><circle cx="314.6666666666667" cy="204.26162499999998" r="4" fill="rgb(31, 95, 168)"><title fill="rgb(31, 95, 168)">October 2026 reached 4,141 on day 11</title></circle></g></svg></g><rect x="18" y="388" width="11" height="11" fill="rgb(31, 95, 168)"/><text x="34" y="397" font-size="12" fill="#5d6677">October 2026, still running</text><rect x="202.859375" y="388" width="11" height="11" fill="rgb(75, 127, 184)"/><text x="218.859375" y="397" font-size="12" fill="#5d6677">earlier months</text><rect x="318.28125" y="388" width="11" height="11" fill="rgb(125, 135, 152)"/><text x="334.28125" y="397" font-size="12" fill="#5d6677">the average month of 2025 (4,141)</text><rect x="545.625" y="388" width="11" height="11" fill="rgb(192, 70, 58)"/><text x="561.625" y="397" font-size="12" fill="#5d6677">the average of the last three full months (12,364)</text><rect x="18" y="407" width="900" height="132" fill="#eef3fa"/><rect x="18" y="407" width="3" height="132" fill="#1f5fa8"/><text x="30" y="423" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="440" font-size="12.5" fill="#1b2230">Each line is one month's running total of published records, day by day; October 2026 in blue is the current, unfinished month. The dashed lines are</text><text x="30" y="457" font-size="12.5" fill="#1b2230">the references: the average month of 2025 (4,141 records) and the average of the last three full months (12,364 records). A dot marks the day a line</text><text x="30" y="474" font-size="12.5" fill="#1b2230">crosses one. The scale is inverse: the fewer days a month needs, the more the EUVD is publishing. October 2026 has 9,765 records in 19 days —</text><text x="30" y="491" font-size="12.5" fill="#1b2230">the average month of 2025: day 11; the average of the last three full months: not yet (day 19 so far). A month that never reaches a reference is not</text><text x="30" y="508" font-size="12.5" fill="#1b2230">reached, not zero. Unlike the bars in panel 1, this panel is already readable for the running month: the crossing day is settled the moment it happens</text><text x="30" y="525" font-size="12.5" fill="#1b2230">and does not wait for the month to end.</text><text x="18" y="566" font-size="11.5" fill="#5d6677">Limits: The publication date, as in panel 1; a jump can mean the EUVD ingested a new source rather than that more vulnerabilities exist. Today counts the day so far,</text><text x="18" y="581" font-size="11.5" fill="#5d6677">not a whole day, so the last point of the blue line is still rising. The 2025 base is fixed on purpose and is not a rolling twelve-month average: a rolling average contains</text><text x="18" y="596" font-size="11.5" fill="#5d6677">the rise itself, so the figure would drift back towards a full month even at constant volume. The three-month average is made of exactly the full months drawn here,</text><text x="18" y="611" font-size="11.5" fill="#5d6677">so a crossing of it says whether that month ran above or below their average; it is marked only on those months and on the running one, because for an older month</text><text x="18" y="626" font-size="11.5" fill="#5d6677">it would be a figure from its own future. Only the last 4 months are kept; the window slides, and earlier months drop out of the chart. A closed month's days and its</text><text x="18" y="641" font-size="11.5" fill="#5d6677">bar in panel 1 were counted on different days, so its total here can differ from the bar by a few records when the EUVD backdates a publication.</text><text x="18" y="671" font-size="11.5" fill="#5d6677">This panel also carries a table, which the image does not include; it is on the page.</text><text x="18" y="691" font-size="10.5" fill="#5d6677">EUVD statistics, 19 Oct 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
