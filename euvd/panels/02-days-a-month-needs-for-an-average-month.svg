09.89634285714286" r="4" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">August 2026 reached 4,141 on day 13</title></circle><polyline points="58,263.0766857142857 83.66666666666667,258.40308571428574 109.33333333333334,253.38114285714286 135,245.2096 160.66666666666669,243.30822857142857 186.33333333333334,241.9729142857143 212,238.3153142857143 237.66666666666666,215.61497142857144 263.33333333333337,206.12262857142858 289,200.54914285714284 314.6666666666667,190.3456 340.3333333333333,188.98125714285715 366,187.05085714285713 391.6666666666667,175.74422857142855 417.3333333333333,155.04685714285716 443,142.40491428571428 468.6666666666667,127.39714285714285 494.3333333333333,119.9368 520,118.44182857142857 545.6666666666667,116.91782857142857 571.3333333333334,112.78125714285713 597,106.16274285714286 622.6666666666666,99.31200000000001 648.3333333333334,91.28559999999999 674,81.40137142857142 699.6666666666666,77.68571428571428 725.3333333333334,75.49405714285714 751,70.93657142857143 776.6666666666666,62.06834285714285 802.3333333333334,52.83725714285714" fill="none" stroke="rgb(75, 127, 184)" stroke-width="1.5" opacity="0.55"></polyline><text x="807.3333333333334" y="56.83725714285714" fill="rgb(93, 102, 119)">Sep 26<title fill="rgb(93, 102, 119)">September 2026: 14,962 records in 30 days</title></text><circle cx="263.33333333333337" cy="209.89634285714286" r="4" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">September 2026 reached 4,141 on day 9</title></circle><circle cx="674" cy="90.54537142857143" r="4" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">September 2026 reached 12,364 on day 25</title></circle><polyline points="58,264.2523428571429 83.66666666666667,258.47565714285713 109.33333333333334,256.8210285714286 135,255.89211428571429 160.66666666666669,249.8977142857143 186.33333333333334,235.09314285714285 212,230.30342857142858 237.66666666666666,222.9446857142857 263.33333333333337,218.35817142857144 289,212.3928 314.6666666666667,208.99645714285714 340.3333333333333,199.0832 366,165.83097142857144 391.6666666666667,153.8712 417.3333333333333,145.1336 443,138.48605714285713 468.6666666666667,137.03462857142858 494.3333333333333,128.90662857142857 520,122.4768 545.6666666666667,94.56582857142857 571.3333333333334,86.59748571428571 597,79.60159999999999 622.6666666666666,72.46057142857143 648.3333333333334,71.3865142857143 674,69.45611428571428 699.6666666666666,58.396228571428566 725.3333333333334,49.32480000000001 751,40.22434285714286 776.6666666666666,32.29954285714285 802.3333333333334,30.25302857142856" fill="none" stroke="rgb(31, 95, 168)" stroke-width="2.5" opacity="1"></polyline><text x="807.3333333333334" y="34.25302857142856" class="t" fill="rgb(27, 34, 48)">Oct 26<title fill="rgb(27, 34, 48)">October 2026: 16,518 records in 30 days</title></text><circle cx="314.6666666666667" cy="209.89634285714286" r="4" fill="rgb(31, 95, 168)"><title fill="rgb(31, 95, 168)">October 2026 reached 4,141 on day 11</title></circle><circle cx="571.3333333333334" cy="90.54537142857143" r="4" fill="rgb(31, 95, 168)"><title fill="rgb(31, 95, 168)">October 2026 reached 12,364 on day 21</title></circle></g></svg></g><rect x="18" y="388" width="11" height="11" fill="rgb(31, 95, 168)"/><text x="34" y="397" font-size="12" fill="#5d6677">October 2026, still running</text><rect x="202.859375" y="388" width="11" height="11" fill="rgb(75, 127, 184)"/><text x="218.859375" y="397" font-size="12" fill="#5d6677">earlier months</text><rect x="318.28125" y="388" width="11" height="11" fill="rgb(125, 135, 152)"/><text x="334.28125" y="397" font-size="12" fill="#5d6677">the average month of 2025 (4,141)</text><rect x="545.625" y="388" width="11" height="11" fill="rgb(192, 70, 58)"/><text x="561.625" y="397" font-size="12" fill="#5d6677">the average of the last three full months (12,364)</text><rect x="18" y="407" width="900" height="132" fill="#eef3fa"/><rect x="18" y="407" width="3" height="132" fill="#1f5fa8"/><text x="30" y="423" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="440" font-size="12.5" fill="#1b2230">Each line is one month's running total of published records, day by day; October 2026 in blue is the current, unfinished month. The dashed lines are</text><text x="30" y="457" font-size="12.5" fill="#1b2230">the references: the average month of 2025 (4,141 records) and the average of the last three full months (12,364 records). A dot marks the day a line</text><text x="30" y="474" font-size="12.5" fill="#1b2230">crosses one. The scale is inverse: the fewer days a month needs, the more the EUVD is publishing. October 2026 has 16,518 records in 30 days —</text><text x="30" y="491" font-size="12.5" fill="#1b2230">the average month of 2025: day 11; the average of the last three full months: day 21. A month that never reaches a reference is not reached, not</text><text x="30" y="508" font-size="12.5" fill="#1b2230">zero. Unlike the bars in panel 1, this panel is already readable for the running month: the crossing day is settled the moment it happens and does not</text><text x="30" y="525" font-size="12.5" fill="#1b2230">wait for the month to end.</text><text x="18" y="566" font-size="11.5" fill="#5d6677">Limits: The publication date, as in panel 1; a jump can mean the EUVD ingested a new source rather than that more vulnerabilities exist. Today counts the day so far,</text><text x="18" y="581" font-size="11.5" fill="#5d6677">not a whole day, so the last point of the blue line is still rising. The 2025 base is fixed on purpose and is not a rolling twelve-month average: a rolling average contains</text><text x="18" y="596" font-size="11.5" fill="#5d6677">the rise itself, so the figure would drift back towards a full month even at constant volume. The three-month average is made of exactly the full months drawn here,</text><text x="18" y="611" font-size="11.5" fill="#5d6677">so a crossing of it says whether that month ran above or below their average; it is marked only on those months and on the running one, because for an older month</text><text x="18" y="626" font-size="11.5" fill="#5d6677">it would be a figure from its own future. Only the last 4 months are kept; the window slides, and earlier months drop out of the chart. A closed month's days and its</text><text x="18" y="641" font-size="11.5" fill="#5d6677">bar in panel 1 were counted on different days, so its total here can differ from the bar by a few records when the EUVD backdates a publication.</text><text x="18" y="671" font-size="11.5" fill="#5d6677">This panel also carries a table, which the image does not include; it is on the page.</text><text x="18" y="691" font-size="10.5" fill="#5d6677">EUVD statistics, 30 Oct 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
