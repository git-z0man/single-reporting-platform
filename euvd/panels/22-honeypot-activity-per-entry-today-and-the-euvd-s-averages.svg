day avg: 61</title></circle><circle cx="636.0343603553079" cy="394" r="5" fill="rgb(192, 70, 58)"><title fill="rgb(192, 70, 58)">EUVD-2026-26246 today: 450 connections from 55 IPs, UPTICK</title></circle></g></svg></g><rect x="18" y="544" width="900" height="98" fill="#eef3fa"/><rect x="18" y="544" width="3" height="98" fill="#1f5fa8"/><text x="30" y="560" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="577" font-size="12.5" fill="#1b2230">Each row is one exploited vulnerability the sensors see attacked, the 16 busiest. The hollow dots are the EUVD's 90-, 30- and 7-day averages, the</text><text x="30" y="594" font-size="12.5" fill="#1b2230">filled dot is today, on a logarithmic scale. The averages are on another, undocumented scale: even a steady entry sits far right of them, so the gap is</text><text x="30" y="611" font-size="12.5" fill="#1b2230">not a jump. Jumps are measured against the entry's own record, in “Do upticks last?”; “Burst or campaign?” below shows how concentrated the</text><text x="30" y="628" font-size="12.5" fill="#1b2230">traffic is. Red rows carry the EUVD's own UPTICK flag (15 of the rows shown; 81 of all 218 entries with counts), grey is steady, green declining.</text><text x="18" y="669" font-size="11.5" fill="#5d6677">Limits: Connection counts from sensors, not victims and not the reporting route. Only 338 of 1,765 exploited entries appear in the sensors at all. The EUVD keeps no</text><text x="18" y="684" font-size="11.5" fill="#5d6677">history of these counts; the daily record started by this monitor is in “Do upticks last?” and in the last panel.</text><text x="18" y="704" font-size="10.5" fill="#5d6677">EUVD statistics, 20 Oct 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
