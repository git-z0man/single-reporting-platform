>2026-05 14 days: 13</title></rect><rect x="681.5" y="139.28" width="32.916666666666664" height="4.32" fill="rgb(125, 135, 152)"><title fill="rgb(125, 135, 152)">2026-05 other: 1</title></rect><text x="681.5" y="244" fill="rgb(93, 102, 119)">May 26</text><rect x="716.4166666666666" y="156.56" width="32.916666666666664" height="73.44" fill="rgb(192, 70, 58)"><title fill="rgb(192, 70, 58)">2026-06 3 days: 17</title></rect><rect x="716.4166666666666" y="130.64" width="32.916666666666664" height="25.92" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">2026-06 14 days: 6</title></rect><rect x="751.3333333333333" y="134.95999999999998" width="32.916666666666664" height="95.04" fill="rgb(192, 70, 58)"><title fill="rgb(192, 70, 58)">2026-07 3 days: 22</title></rect><rect x="751.3333333333333" y="117.67999999999998" width="32.916666666666664" height="17.28" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">2026-07 14 days: 4</title></rect><rect x="786.25" y="134.95999999999998" width="32.916666666666664" height="95.04" fill="rgb(192, 70, 58)"><title fill="rgb(192, 70, 58)">2026-08 3 days: 22</title></rect><rect x="786.25" y="96.07999999999998" width="32.916666666666664" height="38.88" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">2026-08 14 days: 9</title></rect><text x="786.25" y="244" fill="rgb(93, 102, 119)">Aug 26</text><rect x="821.1666666666666" y="83.12" width="32.916666666666664" height="146.88" fill="rgb(192, 70, 58)"><title fill="rgb(192, 70, 58)">2026-09 3 days: 34</title></rect><rect x="821.1666666666666" y="44.24" width="32.916666666666664" height="38.88" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">2026-09 14 days: 9</title></rect><rect x="856.0833333333333" y="104.72" width="32.916666666666664" height="125.28" fill="rgb(192, 70, 58)"><title fill="rgb(192, 70, 58)">2026-10 3 days: 29</title></rect><rect x="856.0833333333333" y="74.48" width="32.916666666666664" height="30.24" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">2026-10 14 days: 7</title></rect><circle cx="732.875" cy="225.68" r="4" fill="rgb(255, 255, 255)" stroke="rgb(27, 34, 48)" stroke-width="1.6"><title fill="rgb(255, 255, 255)">2026-06 forensic triage: 1</title></circle><circle cx="767.7916666666666" cy="139.28" r="4" fill="rgb(255, 255, 255)" stroke="rgb(27, 34, 48)" stroke-width="1.6"><title fill="rgb(255, 255, 255)">2026-07 forensic triage: 21</title></circle><circle cx="802.7083333333334" cy="152.24" r="4" fill="rgb(255, 255, 255)" stroke="rgb(27, 34, 48)" stroke-width="1.6"><title fill="rgb(255, 255, 255)">2026-08 forensic triage: 18</title></circle><circle cx="837.625" cy="91.75999999999999" r="4" fill="rgb(255, 255, 255)" stroke="rgb(27, 34, 48)" stroke-width="1.6"><title fill="rgb(255, 255, 255)">2026-09 forensic triage: 32</title></circle><circle cx="872.5416666666666" cy="126.32" r="4" fill="rgb(255, 255, 255)" stroke="rgb(27, 34, 48)" stroke-width="1.6"><title fill="rgb(255, 255, 255)">2026-10 forensic triage: 24</title></circle></g></svg></g><rect x="18" y="351" width="900" height="132" fill="#eef3fa"/><rect x="18" y="351" width="3" height="132" fill="#1f5fa8"/><text x="30" y="367" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="384" font-size="12.5" fill="#1b2230">Each bar splits a month's new entries by the remediation window CISA set for US federal agencies: 3 days, 7, 14, 21. Hollow dots count entries</text><text x="30" y="401" font-size="12.5" fill="#1b2230">marked for forensic triage: under CISA's directive BOD 26-04 of 10 June 2026 the agency must fix or mitigate the asset within three days and</text><text x="30" y="418" font-size="12.5" fill="#1b2230">examine it for signs that it has already been broken into. In the last three full months 78% of new entries got three days. Forensic triage first appears</text><text x="30" y="435" font-size="12.5" fill="#1b2230">in June 2026 and covers 60% of the entries added since. All 96 marked entries carry the 3-day window, which is what the directive ties the mark to.</text><text x="30" y="452" font-size="12.5" fill="#1b2230">The 21-day window, the old default under BOD 22-01, last appears in March 2026, before the new directive: the move away from it had already</text><text x="30" y="469" font-size="12.5" fill="#1b2230">begun, so it is not the triage mark that ended it.</text><text x="18" y="510" font-size="11.5" fill="#5d6677">Limits: These are deadlines for US federal agencies, not for anyone in the EU; they show how CISA rates urgency, not how dangerous a flaw is in Europe. The triage</text><text x="18" y="525" font-size="11.5" fill="#5d6677">mark is a duty to look for a compromise, not a finding that one happened, and it says nothing about what anyone in the EU must do. forensicTriage refers to BOD</text><text x="18" y="540" font-size="11.5" fill="#5d6677">26-04, which replaced BOD 22-01 on 10 June 2026, and the field is absent for older entries; the windows shown are the ones in the catalogue, which under the</text><text x="18" y="555" font-size="11.5" fill="#5d6677">directive an agency may have to shorten or lengthen for its own assets.</text><text x="18" y="575" font-size="10.5" fill="#5d6677">EUVD statistics, 2 Nov 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
