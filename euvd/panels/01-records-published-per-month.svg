823</title></rect><rect x="786.25" y="68.41274999999999" width="32.916666666666664" height="154.698" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">2026-08 other: 10488</title></rect><text x="786.25" y="264" fill="rgb(93, 102, 119)">Aug 26</text><rect x="821.1666666666666" y="226.9605" width="32.916666666666664" height="23.0395" fill="rgb(192, 70, 58)"><title fill="rgb(192, 70, 58)">2026-09 critical: 1562</title></rect><rect x="821.1666666666666" y="29.281000000000006" width="32.916666666666664" height="197.6795" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">2026-09 other: 13402</title></rect><rect x="856.0833333333333" y="233.3325" width="32.916666666666664" height="16.6675" fill="rgb(192, 70, 58)"><title fill="rgb(192, 70, 58)">2026-10 critical: 1130</title></rect><rect x="856.0833333333333" y="61.52450000000002" width="32.916666666666664" height="171.808" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">2026-10 other: 11648</title></rect></g></svg></g><rect x="18" y="368" width="11" height="11" fill="rgb(192, 70, 58)"/><text x="34" y="377" font-size="12" fill="#5d6677">critical (CVSS 9+)</text><rect x="153.25" y="368" width="11" height="11" fill="rgb(75, 127, 184)"/><text x="169.25" y="377" font-size="12" fill="#5d6677">other records</text><rect x="18" y="387" width="900" height="98" fill="#eef3fa"/><rect x="18" y="387" width="3" height="98" fill="#1f5fa8"/><text x="30" y="403" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="420" font-size="12.5" fill="#1b2230">Each bar is the number of records the EUVD published that month; the red part is the critical ones (CVSS 9 or more). The last full month, September</text><text x="30" y="437" font-size="12.5" fill="#1b2230">2026, had 14,964 records (1,562 critical), against an average of 6,364 a month over the twelve months before it. Counting its days one by one,</text><text x="30" y="454" font-size="12.5" fill="#1b2230">September 2026 had published as much as the average month of 2025 (4,141 records) on day 9, and as much as the average of the last three full</text><text x="30" y="471" font-size="12.5" fill="#1b2230">months (12,364 records) on day 25. It is the busiest month shown.</text><text x="18" y="512" font-size="11.5" fill="#5d6677">Limits: The date is when the EUVD published the record, not when the vulnerability was found. A jump can mean the EUVD ingested a new source rather than that</text><text x="18" y="527" font-size="11.5" fill="#5d6677">more vulnerabilities exist; the API does not say which. The last bar is the current, unfinished month. The two days come from the per-day counts behind panel 2, not</text><text x="18" y="542" font-size="11.5" fill="#5d6677">from an assumed even spread; 2025 is the fixed yardstick because a rolling average rises with the surge and would hide it. They are left out when the data file holds</text><text x="18" y="557" font-size="11.5" fill="#5d6677">no per-day counts for that month.</text><text x="18" y="577" font-size="10.5" fill="#5d6677">EUVD statistics, 22 Oct 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
