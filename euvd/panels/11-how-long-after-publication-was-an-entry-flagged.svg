<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 495" width="936" height="495" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><rect x="0.5" y="0.5" width="935" height="494" fill="none" stroke="#dde1e8"/><text x="18" y="29" font-size="10" letter-spacing="0.6" fill="#5d6677">DISTRIBUTION</text><text x="18" y="50" font-size="17" fill="#1b2230" font-weight="600">11. How long after publication was an entry flagged?</text><text x="18" y="69" font-size="11.5" fill="#5d6677">EUVD record datePublished against exploitedSince, for entries flagged in the last 12 months (360 entries).</text><g transform="translate(18,79) scale(1)" font-size="11"><svg viewBox="0 0 900 260" role="img" width="900" height="260"><g><line x1="40" x2="890" y1="230" y2="230" stroke="rgb(233, 236, 241)"></line><text x="34" y="234" text-anchor="end" fill="rgb(93, 102, 119)">0</text><line x1="40" x2="890" y1="186.8" y2="186.8" stroke="rgb(233, 236, 241)"></line><text x="34" y="190.8" text-anchor="end" fill="rgb(93, 102, 119)">20</text><line x1="40" x2="890" y1="143.6" y2="143.6" stroke="rgb(233, 236, 241)"></line><text x="34" y="147.6" text-anchor="end" fill="rgb(93, 102, 119)">40</text><line x1="40" x2="890" y1="100.4" y2="100.4" stroke="rgb(233, 236, 241)"></line><text x="34" y="104.4" text-anchor="end" fill="rgb(93, 102, 119)">60</text><line x1="40" x2="890" y1="57.19999999999999" y2="57.19999999999999" stroke="rgb(233, 236, 241)"></line><text x="34" y="61.19999999999999" text-anchor="end" fill="rgb(93, 102, 119)">80</text><line x1="40" x2="890" y1="14" y2="14" stroke="rgb(233, 236, 241)"></line><text x="34" y="18" text-anchor="end" fill="rgb(93, 102, 119)">100</text><rect x="50" y="195.44" width="101.42857142857143" height="34.56" fill="rgb(75, 127, 184)"></rect><text x="100.71428571428572" y="190.44" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">16</text><text x="100.71428571428572" y="246" text-anchor="middle" fill="rgb(93, 102, 119)">before publication</text><rect x="171.42857142857144" y="89.6" width="101.42857142857143" height="140.4" fill="rgb(75, 127, 184)"></rect><text x="222.14285714285717" y="84.6" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">65</text><text x="222.14285714285717" y="246" text-anchor="middle" fill="rgb(93, 102, 119)">same day</text><rect x="292.8571428571429" y="48.56" width="101.42857142857143" height="181.44" fill="rgb(75, 127, 184)"></rect><text x="343.5714285714286" y="43.56" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">84</text><text x="343.5714285714286" y="246" text-anchor="middle" fill="rgb(93, 102, 119)">1-7 days</text><rect x="414.2857142857143" y="109.04" width="101.42857142857143" height="120.96" fill="rgb(75, 127, 184)"></rect><text x="465" y="104.04" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">56</text><text x="465" y="246" text-anchor="middle" fill="rgb(93, 102, 119)">8-30</text><rect x="535.7142857142858" y="156.56" width="101.42857142857143" height="73.44" fill="rgb(75, 127, 184)"></rect><text x="586.4285714285714" y="151.56" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">34</text><text x="586.4285714285714" y="246" text-anchor="middle" fill="rgb(93, 102, 119)">31-90</text><rect x="657.1428571428571" y="139.28" width="101.42857142857143" height="90.72" fill="rgb(75, 127, 184)"></rect><text x="707.8571428571428" y="134.28" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">42</text><text x="707.8571428571428" y="246" text-anchor="middle" fill="rgb(93, 102, 119)">91-365</text><rect x="778.5714285714286" y="93.91999999999999" width="101.42857142857143" height="136.08" fill="rgb(75, 127, 184)"></rect><text x="829.2857142857142" y="88.91999999999999" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">63</text><text x="829.2857142857142" y="246" text-anchor="middle" fill="rgb(93, 102, 119)">over a year</text></g></svg></g><rect x="18" y="351" width="900" height="64" fill="#eef3fa"/><rect x="18" y="351" width="3" height="64" fill="#1f5fa8"/><text x="30" y="367" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="384" font-size="12.5" fill="#1b2230">Bars count entries by the gap between publication in the EUVD and the day they were flagged as exploited. The largest group is 1-7 days (84</text><text x="30" y="401" font-size="12.5" fill="#1b2230">entries); 63 waited more than a year. The median gap is 10 days.</text><text x="18" y="442" font-size="11.5" fill="#5d6677">Limits: "Before publication" means flagged before the EUVD record existed, usually a record created late. The gap measures when an entry was flagged, not when</text><text x="18" y="457" font-size="11.5" fill="#5d6677">exploitation began.</text><text x="18" y="477" font-size="10.5" fill="#5d6677">EUVD statistics, 27 Nov 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
