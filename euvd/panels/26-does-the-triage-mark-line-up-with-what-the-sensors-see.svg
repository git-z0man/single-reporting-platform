<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 501" width="936" height="501" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><rect x="0.5" y="0.5" width="935" height="500" fill="none" stroke="#dde1e8"/><text x="18" y="29" font-size="10" letter-spacing="0.6" fill="#5d6677">COMPARISON</text><text x="18" y="50" font-size="17" fill="#1b2230" font-weight="600">26. Does the triage mark line up with what the sensors see?</text><text x="18" y="69" font-size="11.5" fill="#5d6677">/api/honeypotObservations/batch against forensicTriage in the CISA catalogue, for the exploited entries CISA added on or after 10 Jun 2026, the day BOD 26-04 took</text><text x="18" y="84" font-size="11.5" fill="#5d6677">effect.</text><g transform="translate(18,94) scale(1)" font-size="11"><svg viewBox="0 0 900 170" role="img" width="900" height="170"><g><line x1="230" x2="230" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="230" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">0</text><line x1="358" x2="358" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="358" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">10</text><line x1="486" x2="486" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="486" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">100</text><line x1="614" x2="614" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="614" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">1,000</text><line x1="742" x2="742" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="742" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">10,000</text><line x1="870" x2="870" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="870" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">100,000</text><text x="230" y="12" fill="rgb(93, 102, 119)">connections counted today (log scale)</text><text x="220" y="60" text-anchor="end" class="t" fill="rgb(27, 34, 48)">marked for triage: 4 of 97 seen</text><circle cx="807.5415918422792" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">32511 connections today</title></circle><circle cx="762.9609630696904" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">14579 connections today</title></circle><circle cx="420.8942968107869" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">30 connections today</title></circle><circle cx="319.4681605550104" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">4 connections today</title></circle><line x1="724.550997488115" x2="724.550997488115" y1="43" y2="69" stroke="rgb(27, 34, 48)" stroke-width="2"></line><text x="724.550997488115" y="39" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">median 7,305</text><text x="220" y="108" text-anchor="end" class="t" fill="rgb(27, 34, 48)">not marked: 4 of 55 seen</text><circle cx="562.6451848656787" cy="104" r="4" fill="rgb(125, 135, 152)" opacity="0.55"><title fill="rgb(125, 135, 152)">396 connections today</title></circle><circle cx="422.659197224948" cy="104" r="4" fill="rgb(125, 135, 152)" opacity="0.55"><title fill="rgb(125, 135, 152)">31 connections today</title></circle><circle cx="345.5955183349688" cy="104" r="4" fill="rgb(125, 135, 152)" opacity="0.55"><title fill="rgb(125, 135, 152)">7 connections today</title></circle><circle cx="268.5318394449896" cy="104" r="4" fill="rgb(125, 135, 152)" opacity="0.55"><title fill="rgb(125, 135, 152)">1 connections today</title></circle><line x1="396.5318394449896" x2="396.5318394449896" y1="91" y2="117" stroke="rgb(27, 34, 48)" stroke-width="2"></line><text x="396.5318394449896" y="87" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">median 19</text></g></svg></g><rect x="18" y="276" width="900" height="115" fill="#eef3fa"/><rect x="18" y="276" width="3" height="115" fill="#1f5fa8"/><text x="30" y="292" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="309" font-size="12.5" fill="#1b2230">Each dot is one exploited entry CISA added since 10 Jun 2026, placed by the connections Shadowserver's sensors counted today: marked for</text><text x="30" y="326" font-size="12.5" fill="#1b2230">forensic triage on the upper row, not marked on the lower. Only entries added since the directive are compared, because the mark does not exist for</text><text x="30" y="343" font-size="12.5" fill="#1b2230">older ones and the two rows would otherwise mostly measure age. The sensors see 4 of the 97 marked entries and 4 of the 55 unmarked ones —</text><text x="30" y="360" font-size="12.5" fill="#1b2230">the entries CISA rates most urgent are largely ones no sensor emulates, which is the first thing this comparison shows. That is too few to read a</text><text x="30" y="377" font-size="12.5" fill="#1b2230">difference out of, so the dots are shown and the comparison is not made.</text><text x="18" y="418" font-size="11.5" fill="#5d6677">Limits: CISA does not mark entries by honeypot activity: under the directive the window follows from public exposure, KEV status, automatability and technical</text><text x="18" y="433" font-size="11.5" fill="#5d6677">impact, so anything visible here is those factors showing through, not a cause. The sensors see only the products they emulate, so a low count can mean an</text><text x="18" y="448" font-size="11.5" fill="#5d6677">unwatched product rather than a quiet one, and "today" is a single day. Both groups are small, and the unmarked one holds entries CISA simply rated lower, not</text><text x="18" y="463" font-size="11.5" fill="#5d6677">entries it cleared.</text><text x="18" y="483" font-size="10.5" fill="#5d6677">EUVD statistics, 7 Nov 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
