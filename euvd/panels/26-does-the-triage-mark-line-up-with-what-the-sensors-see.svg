<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 501" width="936" height="501" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><rect x="0.5" y="0.5" width="935" height="500" fill="none" stroke="#dde1e8"/><text x="18" y="29" font-size="10" letter-spacing="0.6" fill="#5d6677">COMPARISON</text><text x="18" y="50" font-size="17" fill="#1b2230" font-weight="600">26. Does the triage mark line up with what the sensors see?</text><text x="18" y="69" font-size="11.5" fill="#5d6677">/api/honeypotObservations/batch against forensicTriage in the CISA catalogue, for the exploited entries CISA added on or after 10 Jun 2026, the day BOD 26-04 took</text><text x="18" y="84" font-size="11.5" fill="#5d6677">effect.</text><g transform="translate(18,94) scale(1)" font-size="11"><svg viewBox="0 0 900 170" role="img" width="900" height="170"><g><line x1="230" x2="230" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="230" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">0</text><line x1="443.33333333333337" x2="443.33333333333337" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="443.33333333333337" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">10</text><line x1="656.6666666666667" x2="656.6666666666667" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="656.6666666666667" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">100</text><line x1="870" x2="870" y1="20" y2="148" stroke="rgb(233, 236, 241)"></line><text x="870" y="164" text-anchor="middle" fill="rgb(93, 102, 119)">1,000</text><text x="230" y="12" fill="rgb(93, 102, 119)">connections counted today (log scale)</text><text x="220" y="60" text-anchor="end" class="t" fill="rgb(27, 34, 48)">marked for triage: 9 of 89 seen</text><circle cx="753.0477729118486" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">282 connections today</title></circle><circle cx="738.5472780758253" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">241 connections today</title></circle><circle cx="524.445064898476" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">23 connections today</title></circle><circle cx="379.11360092501735" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">4 connections today</title></circle><circle cx="358.439464816632" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">3 connections today</title></circle><circle cx="358.439464816632" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">3 connections today</title></circle><circle cx="358.439464816632" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">3 connections today</title></circle><circle cx="358.439464816632" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">3 connections today</title></circle><circle cx="294.21973240831596" cy="56" r="4" fill="rgb(192, 70, 58)" opacity="0.55"><title fill="rgb(192, 70, 58)">1 connections today</title></circle><line x1="358.439464816632" x2="358.439464816632" y1="43" y2="69" stroke="rgb(27, 34, 48)" stroke-width="2"></line><text x="358.439464816632" y="39" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">median 3</text><text x="220" y="108" text-anchor="end" class="t" fill="rgb(27, 34, 48)">not marked: 4 of 48 seen</text><circle cx="551.0986620415799" cy="104" r="4" fill="rgb(125, 135, 152)" opacity="0.55"><title fill="rgb(125, 135, 152)">31 connections today</title></circle><circle cx="460.22533249016" cy="104" r="4" fill="rgb(125, 135, 152)" opacity="0.55"><title fill="rgb(125, 135, 152)">11 connections today</title></circle><circle cx="358.439464816632" cy="104" r="4" fill="rgb(125, 135, 152)" opacity="0.55"><title fill="rgb(125, 135, 152)">3 connections today</title></circle><circle cx="358.439464816632" cy="104" r="4" fill="rgb(125, 135, 152)" opacity="0.55"><title fill="rgb(125, 135, 152)">3 connections today</title></circle><line x1="422.659197224948" x2="422.659197224948" y1="91" y2="117" stroke="rgb(27, 34, 48)" stroke-width="2"></line><text x="422.659197224948" y="87" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">median 7</text></g></svg></g><rect x="18" y="276" width="900" height="115" fill="#eef3fa"/><rect x="18" y="276" width="3" height="115" fill="#1f5fa8"/><text x="30" y="292" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="309" font-size="12.5" fill="#1b2230">Each dot is one exploited entry CISA added since 10 Jun 2026, placed by the connections Shadowserver's sensors counted today: marked for</text><text x="30" y="326" font-size="12.5" fill="#1b2230">forensic triage on the upper row, not marked on the lower. Only entries added since the directive are compared, because the mark does not exist for</text><text x="30" y="343" font-size="12.5" fill="#1b2230">older ones and the two rows would otherwise mostly measure age. The sensors see 9 of the 89 marked entries and 4 of the 48 unmarked ones —</text><text x="30" y="360" font-size="12.5" fill="#1b2230">the entries CISA rates most urgent are largely ones no sensor emulates, which is the first thing this comparison shows. That is too few to read a</text><text x="30" y="377" font-size="12.5" fill="#1b2230">difference out of, so the dots are shown and the comparison is not made.</text><text x="18" y="418" font-size="11.5" fill="#5d6677">Limits: CISA does not mark entries by honeypot activity: under the directive the window follows from public exposure, KEV status, automatability and technical</text><text x="18" y="433" font-size="11.5" fill="#5d6677">impact, so anything visible here is those factors showing through, not a cause. The sensors see only the products they emulate, so a low count can mean an</text><text x="18" y="448" font-size="11.5" fill="#5d6677">unwatched product rather than a quiet one, and "today" is a single day. Both groups are small, and the unmarked one holds entries CISA simply rated lower, not</text><text x="18" y="463" font-size="11.5" fill="#5d6677">entries it cleared.</text><text x="18" y="483" font-size="10.5" fill="#5d6677">EUVD statistics, 21 Oct 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
