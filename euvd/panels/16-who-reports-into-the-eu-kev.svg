" y="207" fill="rgb(93, 102, 119)">0</text><text x="172" y="228" text-anchor="end" class="t" fill="rgb(27, 34, 48)">CERT-EE, CERT-PL</text><rect x="180" y="216" width="25.76923076923077" height="11" fill="rgb(125, 135, 152)"><title fill="rgb(125, 135, 152)">CERT-EE, CERT-PL: 1</title></rect><text x="210.76923076923077" y="227" class="t" fill="rgb(27, 34, 48)">1</text><rect x="180" y="229" width="0" height="8" fill="rgb(224, 160, 48)" opacity="0.65"></rect><text x="185" y="237" fill="rgb(93, 102, 119)">0</text><text x="172" y="258" text-anchor="end" class="t" fill="rgb(27, 34, 48)">EL-CSIRT</text><rect x="180" y="246" width="25.76923076923077" height="11" fill="rgb(125, 135, 152)"><title fill="rgb(125, 135, 152)">EL-CSIRT: 1</title></rect><text x="210.76923076923077" y="257" class="t" fill="rgb(27, 34, 48)">1</text><rect x="180" y="259" width="0" height="8" fill="rgb(224, 160, 48)" opacity="0.65"></rect><text x="185" y="267" fill="rgb(93, 102, 119)">0</text><text x="172" y="288" text-anchor="end" class="t" fill="rgb(27, 34, 48)">NCSC HU</text><rect x="180" y="276" width="25.76923076923077" height="11" fill="rgb(125, 135, 152)"><title fill="rgb(125, 135, 152)">NCSC HU: 1</title></rect><text x="210.76923076923077" y="287" class="t" fill="rgb(27, 34, 48)">1</text><rect x="180" y="289" width="0" height="8" fill="rgb(224, 160, 48)" opacity="0.65"></rect><text x="185" y="297" fill="rgb(93, 102, 119)">0</text><text x="172" y="318" text-anchor="end" class="t" fill="rgb(27, 34, 48)">NCSC-FI</text><rect x="180" y="306" width="25.76923076923077" height="11" fill="rgb(125, 135, 152)"><title fill="rgb(125, 135, 152)">NCSC-FI: 1</title></rect><text x="210.76923076923077" y="317" class="t" fill="rgb(27, 34, 48)">1</text><rect x="180" y="319" width="0" height="8" fill="rgb(224, 160, 48)" opacity="0.65"></rect><text x="185" y="327" fill="rgb(93, 102, 119)">0</text></g></svg></g><rect x="18" y="433" width="900" height="64" fill="#eef3fa"/><rect x="18" y="433" width="3" height="64" fill="#1f5fa8"/><text x="30" y="449" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="466" font-size="12.5" fill="#1b2230">Pairs of bars per source: grey before the go-live, gold from 11 Sep 2026. Appearing only after the go-live: CSIRT-IE (3), NCSC-NL (3). The table lists</text><text x="30" y="483" font-size="12.5" fill="#1b2230">every entry added since the go-live with its source.</text><text x="18" y="524" font-size="11.5" fill="#5d6677">Limits: The origin is who brought the entry into the EU KEV, not how the vulnerability first reached anyone; a CSIRT can learn of exploitation in many ways besides an</text><text x="18" y="539" font-size="11.5" fill="#5d6677">SRP notification. Still the most direct pointer the public data offers towards the SRP, because CRA notifications go to a national CSIRT.</text><text x="18" y="569" font-size="11.5" fill="#5d6677">This panel also carries a table, which the image does not include; it is on the page.</text><text x="18" y="589" font-size="10.5" fill="#5d6677">EUVD statistics, 27 Oct 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
