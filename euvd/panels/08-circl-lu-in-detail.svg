e="rgb(233, 236, 241)"></line><text x="28" y="40.85714285714286" text-anchor="end" fill="rgb(93, 102, 119)">300</text><line x1="34" x2="274" y1="14" y2="14" stroke="rgb(233, 236, 241)"></line><text x="28" y="18" text-anchor="end" fill="rgb(93, 102, 119)">350</text><rect x="37" y="30.457142857142856" width="234" height="143.54285714285714" fill="rgb(31, 95, 168)"></rect><text x="154" y="26.457142857142856" text-anchor="middle" class="t" fill="rgb(27, 34, 48)">314</text><text x="154" y="187" text-anchor="middle" fill="rgb(93, 102, 119)">'26</text></g></svg></g><g transform="translate(18,302) scale(1)" font-size="11"><svg viewBox="0 0 280 196" role="img" width="280" height="196"><g><text x="113" y="14" text-anchor="end" class="t" fill="rgb(27, 34, 48)">MISP</text><rect x="118" y="3" width="132" height="12" fill="rgb(75, 127, 184)"></rect><text x="254" y="14" fill="rgb(93, 102, 119)">190</text><text x="113" y="33" text-anchor="end" class="t" fill="rgb(27, 34, 48)">flowintel</text><rect x="118" y="22" width="35.43157894736842" height="12" fill="rgb(75, 127, 184)"></rect><text x="157.43157894736842" y="33" fill="rgb(93, 102, 119)">51</text><text x="113" y="52" text-anchor="end" class="t" fill="rgb(27, 34, 48)">RansomLook</text><rect x="118" y="41" width="9.031578947368422" height="12" fill="rgb(75, 127, 184)"></rect><text x="131.03157894736842" y="52" fill="rgb(93, 102, 119)">13</text><text x="113" y="71" text-anchor="end" class="t" fill="rgb(27, 34, 48)">vulnerability-look</text><rect x="118" y="60" width="6.252631578947368" height="12" fill="rgb(75, 127, 184)"></rect><text x="128.2526315789474" y="71" fill="rgb(93, 102, 119)">9</text><text x="113" y="90" text-anchor="end" class="t" fill="rgb(27, 34, 48)">ail project</text><rect x="118" y="79" width="5.557894736842106" height="12" fill="rgb(75, 127, 184)"></rect><text x="127.5578947368421" y="90" fill="rgb(93, 102, 119)">8</text><text x="113" y="109" text-anchor="end" class="t" fill="rgb(27, 34, 48)">pivotick</text><rect x="118" y="98" width="5.557894736842106" height="12" fill="rgb(75, 127, 184)"></rect><text x="127.5578947368421" y="109" fill="rgb(93, 102, 119)">8</text><text x="113" y="128" text-anchor="end" class="t" fill="rgb(27, 34, 48)">ail-project</text><rect x="118" y="117" width="4.168421052631579" height="12" fill="rgb(75, 127, 184)"></rect><text x="126.16842105263157" y="128" fill="rgb(93, 102, 119)">6</text><text x="113" y="147" text-anchor="end" class="t" fill="rgb(27, 34, 48)">DJI</text><rect x="118" y="136" width="3.473684210526316" height="12" fill="rgb(75, 127, 184)"></rect><text x="125.47368421052632" y="147" fill="rgb(93, 102, 119)">5</text><text x="113" y="166" text-anchor="end" class="t" fill="rgb(27, 34, 48)">pandora-analysis</text><rect x="118" y="155" width="3.473684210526316" height="12" fill="rgb(75, 127, 184)"></rect><text x="125.47368421052632" y="166" fill="rgb(93, 102, 119)">5</text><text x="113" y="185" text-anchor="end" class="t" fill="rgb(27, 34, 48)">Lookyloo</text><rect x="118" y="174" width="3.473684210526316" height="12" fill="rgb(75, 127, 184)"></rect><text x="125.47368421052632" y="185" fill="rgb(93, 102, 119)">5</text></g></svg></g><g transform="translate(18,506) scale(1)" font-size="11"><svg viewBox="0 0 280 156" role="img" width="280" height="156"><g><text x="0" y="14" class="t" fill="rgb(27, 34, 48)">Critical (9-10): 24</text><rect x="0" y="18" width="34.666666666666664" height="9" fill="rgb(192, 70, 58)"></rect><text x="0" y="44" class="t" fill="rgb(27, 34, 48)">High (7-8.9): 106</text><rect x="0" y="48" width="153.11111111111111" height="9" fill="rgb(224, 160, 48)"></rect><text x="0" y="74" class="t" fill="rgb(27, 34, 48)">Medium (4-6.9): 180</text><rect x="0" y="78" width="260" height="9" fill="rgb(42, 157, 143)"></rect><text x="0" y="104" class="t" fill="rgb(27, 34, 48)">Low (below 4): 4</text><rect x="0" y="108" width="5.777777777777778" height="9" fill="rgb(63, 143, 91)"></rect><text x="0" y="134" class="t" fill="rgb(27, 34, 48)">No score: 0</text><rect x="0" y="138" width="0" height="9" fill="rgb(125, 135, 152)"></rect></g></svg></g><rect x="18" y="674" width="620" height="98" fill="#eef3fa"/><rect x="18" y="674" width="3" height="98" fill="#1f5fa8"/><text x="30" y="690" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="707" font-size="12.5" fill="#1b2230">CIRCL (LU) assigns records in the EUVD, as CNA CIRCL: 314 in all. Left: records by year of</text><text x="30" y="724" font-size="12.5" fill="#1b2230">publication, 314 in 2026 so far. Middle: the vendors they cover, led by MISP, flowintel, RansomLook.</text><text x="30" y="741" font-size="12.5" fill="#1b2230">Right: severity; the largest group is medium (4-6.9). None of the records is flagged as exploited. The</text><text x="30" y="758" font-size="12.5" fill="#1b2230">table lists the records with the highest EPSS, the modelled chance of exploitation.</text><text x="18" y="799" font-size="11.5" fill="#5d6677">Limits: Assigning a CVE is not the same as reporting an exploited vulnerability: a CNA coordinates disclosure for</text><text x="18" y="814" font-size="11.5" fill="#5d6677">the vendors it covers. A high EPSS is a prediction, not evidence of exploitation. 0 records carry no publication</text><text x="18" y="829" font-size="11.5" fill="#5d6677">date and are left out of the yearly count. Profiled here: CERT@VDE (DE), CERT Polska (PL), INCIBE-CERT (ES),</text><text x="18" y="844" font-size="11.5" fill="#5d6677">CIRCL (LU); the list is set in euvd/build_stats.py.</text><text x="18" y="874" font-size="11.5" fill="#5d6677">This panel also carries a table, which the image does not include; it is on the page.</text><text x="18" y="894" font-size="10.5" fill="#5d6677">EUVD statistics, 21 Nov 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
