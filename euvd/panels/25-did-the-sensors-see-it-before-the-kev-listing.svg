<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 435" width="936" height="435" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><rect x="0.5" y="0.5" width="935" height="434" fill="none" stroke="#dde1e8"/><text x="18" y="29" font-size="10" letter-spacing="0.6" fill="#5d6677">TIMING</text><text x="18" y="50" font-size="17" fill="#1b2230" font-weight="600">25. Did the sensors see it before the KEV listing?</text><text x="18" y="69" font-size="11.5" fill="#5d6677">The honeypot observations' firstSeenAt (the first day the sensors recorded attempts against the CVE) against exploitedSince, which for nearly every entry is the day</text><text x="18" y="84" font-size="11.5" fill="#5d6677">CISA listed it.</text><g transform="translate(18,94) scale(1)" font-size="11"><svg viewBox="0 0 900 138" role="img" width="900" height="138"><g><text x="222" y="18" text-anchor="end" class="t" fill="rgb(27, 34, 48)">sensors over a year before</text><rect x="230" y="6" width="27.074235807860262" height="13" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">sensors over a year before: 10</title></rect><text x="262.07423580786025" y="17" class="t" fill="rgb(27, 34, 48)">10</text><text x="222" y="39" text-anchor="end" class="t" fill="rgb(27, 34, 48)">sensors 31-365 days before</text><rect x="230" y="27" width="18.951965065502183" height="13" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">sensors 31-365 days before: 7</title></rect><text x="253.95196506550218" y="38" class="t" fill="rgb(27, 34, 48)">7</text><text x="222" y="60" text-anchor="end" class="t" fill="rgb(27, 34, 48)">sensors 1-30 days before</text><rect x="230" y="48" width="54.148471615720524" height="13" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">sensors 1-30 days before: 20</title></rect><text x="289.1484716157205" y="59" class="t" fill="rgb(27, 34, 48)">20</text><text x="222" y="81" text-anchor="end" class="t" fill="rgb(27, 34, 48)">sensors same day</text><rect x="230" y="69" width="5.414847161572053" height="13" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">sensors same day: 2</title></rect><text x="240.41484716157206" y="80" class="t" fill="rgb(27, 34, 48)">2</text><text x="222" y="102" text-anchor="end" class="t" fill="rgb(27, 34, 48)">sensors 1-30 days after</text><rect x="230" y="90" width="102.882096069869" height="13" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">sensors 1-30 days after: 38</title></rect><text x="337.882096069869" y="101" class="t" fill="rgb(27, 34, 48)">38</text><text x="222" y="123" text-anchor="end" class="t" fill="rgb(27, 34, 48)">sensors over 30 days after</text><rect x="230" y="111" width="620" height="13" fill="rgb(42, 157, 143)"><title fill="rgb(42, 157, 143)">sensors over 30 days after: 229</title></rect><text x="855" y="122" class="t" fill="rgb(27, 34, 48)">229</text></g></svg></g><rect x="18" y="244" width="900" height="81" fill="#eef3fa"/><rect x="18" y="244" width="3" height="81" fill="#1f5fa8"/><text x="30" y="260" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="277" font-size="12.5" fill="#1b2230">339 exploited entries have a first sighting. 33 were first seen on 23 Jun 2022, the first day of the sensors' record, so their sighting may be older;</text><text x="30" y="294" font-size="12.5" fill="#1b2230">they are left out of the bars. Of the other 306, 37 were seen before the entry was flagged (20 within 30 days before), 2 on the day and 267 after. The</text><text x="30" y="311" font-size="12.5" fill="#1b2230">table lists the 6 entries flagged since the go-live.</text><text x="18" y="352" font-size="11.5" fill="#5d6677">Limits: A first sighting is the first day Shadowserver's sensors recorded attempts against the CVE. Sensors learn new vulnerabilities over time, so "after" can mean</text><text x="18" y="367" font-size="11.5" fill="#5d6677">the sensor came late, not the attacks. Neither date says how the vulnerability reached ENISA.</text><text x="18" y="397" font-size="11.5" fill="#5d6677">This panel also carries a table, which the image does not include; it is on the page.</text><text x="18" y="417" font-size="10.5" fill="#5d6677">EUVD statistics, 24 Oct 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
