anchor="end" class="t" fill="rgb(27, 34, 48)">Carlo Gavazzi Auto</text><rect x="118" y="155" width="13.401015228426395" height="12" fill="rgb(75, 127, 184)"></rect><text x="135.4010152284264" y="166" fill="rgb(93, 102, 119)">20</text><text x="113" y="185" text-anchor="end" class="t" fill="rgb(27, 34, 48)">Carlo Gavazzi</text><rect x="118" y="174" width="8.040609137055837" height="12" fill="rgb(75, 127, 184)"></rect><text x="130.04060913705584" y="185" fill="rgb(93, 102, 119)">12</text></g></svg></g><g transform="translate(18,506) scale(1)" font-size="11"><svg viewBox="0 0 280 156" role="img" width="280" height="156"><g><text x="0" y="14" class="t" fill="rgb(27, 34, 48)">Critical (9-10): 122</text><rect x="0" y="18" width="76.25" height="9" fill="rgb(192, 70, 58)"></rect><text x="0" y="44" class="t" fill="rgb(27, 34, 48)">High (7-8.9): 416</text><rect x="0" y="48" width="260" height="9" fill="rgb(224, 160, 48)"></rect><text x="0" y="74" class="t" fill="rgb(27, 34, 48)">Medium (4-6.9): 189</text><rect x="0" y="78" width="118.125" height="9" fill="rgb(42, 157, 143)"></rect><text x="0" y="104" class="t" fill="rgb(27, 34, 48)">Low (below 4): 10</text><rect x="0" y="108" width="6.25" height="9" fill="rgb(63, 143, 91)"></rect><text x="0" y="134" class="t" fill="rgb(27, 34, 48)">No score: 83</text><rect x="0" y="138" width="51.875" height="9" fill="rgb(125, 135, 152)"></rect></g></svg></g><rect x="18" y="674" width="620" height="115" fill="#eef3fa"/><rect x="18" y="674" width="3" height="115" fill="#1f5fa8"/><text x="30" y="690" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="707" font-size="12.5" fill="#1b2230">CERT@VDE (DE) assigns records in the EUVD, as CNA CERTVDE: 820 in all. Left: records by year of</text><text x="30" y="724" font-size="12.5" fill="#1b2230">publication, 204 in 2026 so far. Middle: the vendors they cover, led by PHOENIX CONTACT,</text><text x="30" y="741" font-size="12.5" fill="#1b2230">CODESYS, MB connect line. Right: severity; the largest group is high (7-8.9). None of the records is</text><text x="30" y="758" font-size="12.5" fill="#1b2230">flagged as exploited. The table lists the records with the highest EPSS, the modelled chance of</text><text x="30" y="775" font-size="12.5" fill="#1b2230">exploitation.</text><text x="18" y="816" font-size="11.5" fill="#5d6677">Limits: Assigning a CVE is not the same as reporting an exploited vulnerability: a CNA coordinates disclosure for</text><text x="18" y="831" font-size="11.5" fill="#5d6677">the vendors it covers. A high EPSS is a prediction, not evidence of exploitation. 71 records carry no publication</text><text x="18" y="846" font-size="11.5" fill="#5d6677">date and are left out of the yearly count. Profiled here: CERT@VDE (DE), CERT Polska (PL), INCIBE-CERT (ES),</text><text x="18" y="861" font-size="11.5" fill="#5d6677">CIRCL (LU); the list is set in euvd/build_stats.py.</text><text x="18" y="891" font-size="11.5" fill="#5d6677">This panel also carries a table, which the image does not include; it is on the page.</text><text x="18" y="911" font-size="10.5" fill="#5d6677">EUVD statistics, 26 Oct 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
