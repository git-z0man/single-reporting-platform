"t" fill="rgb(27, 34, 48)">Code injection</text><rect x="170" y="162" width="142.78991596638656" height="14" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">CWE-94 Code injection: 72</title></rect><text x="317.78991596638656" y="174" fill="rgb(93, 102, 119)">72</text><text x="164" y="200" text-anchor="end" class="t" fill="rgb(27, 34, 48)">Unsafe deserialisation</text><rect x="170" y="188" width="140.80672268907563" height="14" fill="rgb(75, 127, 184)"><title fill="rgb(75, 127, 184)">CWE-502 Unsafe deserialisation: 71</title></rect><text x="315.8067226890756" y="200" fill="rgb(93, 102, 119)">71</text></g></svg></g><rect x="18" y="547" width="620" height="81" fill="#eef3fa"/><rect x="18" y="547" width="3" height="81" fill="#1f5fa8"/><text x="30" y="563" font-size="9.5" letter-spacing="0.6" font-weight="600" fill="#1f5fa8">WHAT YOU SEE</text><text x="30" y="580" font-size="12.5" fill="#1b2230">Left: the share of entries CISA knows to be used by ransomware groups, by year added: 27% in</text><text x="30" y="597" font-size="12.5" fill="#1b2230">2021, 10% in 2026. Right: the most frequent weakness types, led by Improper input validation, OS</text><text x="30" y="614" font-size="12.5" fill="#1b2230">command injection, Out-of-bounds write.</text><text x="18" y="655" font-size="11.5" fill="#5d6677">Limits: "Known" ransomware use is added as CISA learns of it, so recent years are low partly because that</text><text x="18" y="670" font-size="11.5" fill="#5d6677">knowledge has not arrived yet. One entry can carry several weakness types, and older entries often carry none.</text><text x="18" y="690" font-size="10.5" fill="#5d6677">EUVD statistics, 30 Oct 2026 - github.com/git-z0man/single-reporting-platform</text></svg>
